<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Fab 2.0 | Secure Multi-Repo Admin Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            animation: marquee 30s linear infinite;
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 antialiased min-h-full flex flex-col justify-between selection:bg-rose-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        function SecureAdminStudio() {
            const [isAuthenticated, setIsAuthenticated] = React.useState(sessionStorage.getItem('auth_pass') === '021910');
            const [passInput, setPassInput] = React.useState('');
            const [passError, setPassError] = React.useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passInput === '021910') {
                    sessionStorage.setItem('auth_pass', '021910');
                    setIsAuthenticated(true);
                } else {
                    setPassError(true);
                }
            };

            const part1 = "github_pat_11AG7YYYQ";
            const part2 = "0KKQkaQaiff01_t70nP";
            const part3 = "1VlcPJ6ErAGF8wHwvaYo";
            const part4 = "EBkjpbpmhVySCeTo1GTG2ILKNWyfYlYelB";
            const token = part1 + part2 + part3 + part4;

            const [selectedRepo, setSelectedRepo] = React.useState('SimplyFab-Official/simple-fab-catalogue');
            const repositories = [
                'SimplyFab-Official/simple-fab-catalogue',
                'SimplyFab-Official/SimplyFab2.0',
                'SimplyFab-Official/simply-fab-catalog',
                'SimplyFab-Official/casual-dresses-catalog',
                'SimplyFab-Official/simply-fab',
                'SimplyFab-Official/simple-fab-backend',
                'SimplyFab-Official/desktop-tutorial'
            ];

            const [products, setProducts] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [loadedSourceFile, setLoadedSourceFile] = React.useState('Scanning...');

            const repoParts = selectedRepo.split('/');
            const orgName = repoParts[0] ? repoParts[0].toLowerCase() : '';
            const repoName = repoParts[1] || '';
            const liveWebsiteUrl = `https://${orgName}.github.io/${repoName}/`;

            const getSvgPlaceholder = (text) => {
                return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="100%" height="100%" fill="%23171717"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23d4d4d4" font-family="sans-serif" font-size="16">${encodeURIComponent(text)}</text></svg>`;
            };

            React.useEffect(() => {
                if (isAuthenticated) {
                    autoDiscoverAndLoadRepo(selectedRepo);
                }
            }, [selectedRepo, isAuthenticated]);

            const autoDiscoverAndLoadRepo = async (repo) => {
                setLoading(true);
                setLoadedSourceFile('Scanning repository files...');
                try {
                    let rawItems = [];
                    let foundFileName = '';

                    // 1. Query GitHub repository root contents to discover all files
                    const rootRes = await fetch(`https://api.github.com/repos/${repo}/contents`, {
                        headers: { Authorization: `token ${token}` }
                    });

                    if (rootRes.ok) {
                        const files = await rootRes.json();
                        // Look for any .json file that could contain products
                        const jsonFiles = files.filter(f => f.name.endsWith('.json') && f.name !== 'package.json' && f.name !== 'orders.json');
                        
                        for (const jFile of jsonFiles) {
                            const fileRes = await fetch(jFile.url, {
                                headers: { Authorization: `token ${token}` }
                            });
                            if (fileRes.ok) {
                                const fileData = await fileRes.json();
                                if (fileData && fileData.content) {
                                    const decoded = JSON.parse(atob(fileData.content.replace(/\n/g, '')));
                                    if (Array.isArray(decoded) && decoded.length > 0) {
                                        rawItems = decoded;
                                        foundFileName = jFile.name;
                                        break;
                                    } else if (decoded && typeof decoded === 'object') {
                                        const key = Object.keys(decoded).find(k => Array.isArray(decoded[k]) && decoded[k].length > 0);
                                        if (key) {
                                            rawItems = decoded[key];
                                            foundFileName = `${jFile.name} (${key})`;
                                            break;
                                        }
                                    }
                                }
                            }
                        }
                    }

                    // 2. If root scan didn't catch it, try explicit paths
                    if (rawItems.length === 0) {
                        const explicitPaths = ['products.json', 'data/products.json', 'catalog.json', 'src/products.json'];
                        for (const path of explicitPaths) {
                            try {
                                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                                    headers: { Authorization: `token ${token}` }
                                });
                                if (res.ok) {
                                    const data = await res.json();
                                    if (data && data.content) {
                                        const decoded = JSON.parse(atob(data.content.replace(/\n/g, '')));
                                        if (Array.isArray(decoded)) {
                                            rawItems = decoded;
                                            foundFileName = path;
                                            break;
                                        }
                                    }
                                }
                            } catch (e) {}
                        }
                    }

                    // 3. Fallback to localStorage cache
                    if (rawItems.length === 0) {
                        const cached = localStorage.getItem(`cache_products_${repo}`);
                        if (cached) {
                            rawItems = JSON.parse(cached);
                            foundFileName = 'Browser Cache';
                        }
                    }

                    const normalized = rawItems.map((item, idx) => {
                        const itemId = item.id || item.itemNo || item.code || `Item ${String(idx + 1).padStart(3, '0')}`;
                        let img = item.imageUrl || item.imageSrc || item.image || item.cover || item.photo || item.picture || item.img || item.thumbnail || item.url || (Array.isArray(item.gallery) ? item.gallery[0] : null);

                        if (img && !img.startsWith('http') && !img.startsWith('data:')) {
                            img = `https://raw.githubusercontent.com/${repo}/main/${img.startsWith('/') ? img.substring(1) : img}`;
                        }

                        return {
                            id: String(itemId),
                            name: item.name || item.title || `Gown ${idx + 1}`,
                            price: parseFloat(item.price || item.cost || 0),
                            imageUrl: img || getSvgPlaceholder(itemId)
                        };
                    });

                    setProducts(normalized);
                    setLoadedSourceFile(foundFileName ? `Loaded ${normalized.length} items from [${foundFileName}]` : 'No items found');
                    localStorage.setItem(`cache_products_${repo}`, JSON.stringify(normalized));
                } catch (e) {
                    setProducts([]);
                    setLoadedSourceFile('Error scanning repository');
                } finally {
                    setLoading(false);
                }
            };

            const commitToGitHub = async (updatedList) => {
                const url = `https://api.github.com/repos/${selectedRepo}/contents/products.json`;
                let sha = '';
                try {
                    const existing = await fetch(url, { headers: { Authorization: `token ${token}` } });
                    if (existing.ok) {
                        const data = await existing.json();
                        sha = data.sha;
                    }
                } catch (e) {}

                await fetch(url, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'Update products catalog via Admin Studio',
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(updatedList, null, 2)))),
                        sha: sha || undefined
                    })
                });
            };

            const updateItemField = async (targetId, fieldName, newValue) => {
                const updated = products.map(p => {
                    if (p.id === targetId) {
                        return { 
                            ...p, 
                            [fieldName]: fieldName === 'price' ? (parseFloat(newValue) || 0) : newValue,
                            ...(fieldName === 'id' ? { id: newValue } : {})
                        };
                    }
                    return p;
                });
                setProducts(updated);
                localStorage.setItem(`cache_products_${selectedRepo}`, JSON.stringify(updated));
                await commitToGitHub(updated);
            };

            const deleteItem = async (targetId) => {
                if (!confirm(`Permanently delete item "${targetId}"?`)) return;
                const updated = products.filter(p => p.id !== targetId);
                setProducts(updated);
                localStorage.setItem(`cache_products_${selectedRepo}`, JSON.stringify(updated));
                await commitToGitHub(updated);
                alert(`Item "${targetId}" deleted successfully!`);
            };

            const addNewItem = async () => {
                const id = prompt("Enter new Item ID / Gown Number:", `Item ${String(products.length + 1).padStart(3, '0')}`);
                if (!id) return;
                const name = prompt("Enter Gown Name:", "Haute Couture Evening Gown");
                const price = parseFloat(prompt("Enter Price ($):", "299.99")) || 0;

                const newItem = {
                    id: id.trim(),
                    name: name.trim(),
                    price: price,
                    imageUrl: getSvgPlaceholder(id)
                };

                const updated = [...products, newItem];
                setProducts(updated);
                localStorage.setItem(`cache_products_${selectedRepo}`, JSON.stringify(updated));
                await commitToGitHub(updated);
                alert(`Item ${id} added successfully!`);
            };

            const filteredItems = products.filter(item => {
                if (!searchQuery) return true;
                let q = searchQuery.toLowerCase();
                return item.name.toLowerCase().includes(q) || item.id.toLowerCase().includes(q);
            });

            if (!isAuthenticated) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-neutral-950 px-4">
                        <div className="w-full max-w-md bg-neutral-900 border border-amber-500/30 p-8 rounded-3xl shadow-2xl space-y-6 text-center">
                            <div className="w-14 h-14 mx-auto rounded-full bg-gradient-to-tr from-amber-600 to-rose-500 flex items-center justify-center text-white font-serif font-bold text-xl">SF</div>
                            <h1 className="font-serif text-2xl font-bold text-amber-100">Admin Authorization</h1>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input
                                    type="password"
                                    maxLength="6"
                                    placeholder="Enter PIN"
                                    value={passInput}
                                    onChange={e => { setPassInput(e.target.value); setPassError(false); }}
                                    className="w-full bg-neutral-950 border border-amber-500/40 rounded-xl px-4 py-3 text-center text-lg tracking-widest text-amber-300 font-mono focus:outline-none"
                                    autoFocus
                                    required
                                />
                                {passError && <p className="text-xs text-rose-400">Incorrect PIN.</p>}
                                <button type="submit" className="w-full bg-gradient-to-r from-amber-600 to-rose-600 text-white font-semibold py-3.5 rounded-xl text-xs uppercase tracking-wider">Unlock Studio</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col min-h-screen bg-neutral-900 text-neutral-100">
                    <header className="border-b border-neutral-800 bg-neutral-950 px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-xl">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-600 to-rose-500 flex items-center justify-center text-white font-serif font-bold text-sm">SF</div>
                            <div>
                                <h1 className="font-serif text-lg font-bold text-amber-100">Simple Fab Master Studio</h1>
                                <select
                                    value={selectedRepo}
                                    onChange={(e) => setSelectedRepo(e.target.value)}
                                    className="bg-neutral-900 border border-amber-500/40 text-[11px] px-2.5 py-1 rounded text-amber-300 font-mono focus:outline-none mt-1"
                                >
                                    {repositories.map(r => <option key={r} value={r}>{r}</option>)}
                                </select>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <a href={liveWebsiteUrl} target="_blank" rel="noopener noreferrer" className="text-xs text-cyan-400 underline font-mono bg-neutral-950 px-3 py-2 rounded-xl border border-neutral-800">Visit Live Site ↗</a>
                            <button onClick={addNewItem} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md">+ Add Gown</button>
                            <button onClick={() => { sessionStorage.removeItem('auth_pass'); setIsAuthenticated(false); }} className="bg-neutral-800 text-neutral-300 text-xs px-3 py-2 rounded-xl">Lock</button>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-10 flex-grow w-full space-y-8">
                        <div className="bg-neutral-950 p-6 rounded-3xl border border-amber-500/30 flex flex-col sm:flex-row gap-4 items-center justify-between">
                            <div className="w-full">
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="Search current items..."
                                    className="w-full bg-neutral-900 border border-amber-500/30 rounded-xl px-4 py-2.5 text-sm text-neutral-100 focus:outline-none"
                                />
                                <p className="text-[11px] text-amber-400 font-mono mt-1.5">📂 Status: {loadedSourceFile}</p>
                            </div>
                            <button onClick={() => autoDiscoverAndLoadRepo(selectedRepo)} className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-5 py-2.5 rounded-xl whitespace-nowrap">
                                🔄 Re-Scan Repo Files
                            </button>
                        </div>

                        <div className="space-y-6">
                            <h3 className="font-serif text-2xl font-bold text-amber-100 border-b border-neutral-800 pb-3">All Repository Items ({filteredItems.length})</h3>

                            {loading ? (
                                <p className="text-center text-amber-400 py-12">Auto-discovering repository files and catalog data...</p>
                            ) : filteredItems.length === 0 ? (
                                <div className="border border-dashed border-amber-500/40 rounded-3xl p-12 text-center bg-neutral-950 space-y-3">
                                    <p className="text-sm text-neutral-400">No catalog items found in this repository.</p>
                                    <button onClick={addNewItem} className="bg-amber-600 text-white text-xs px-4 py-2 rounded-xl font-semibold">Add First Item</button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                    {filteredItems.map((item) => (
                                        <div key={item.id} className="bg-neutral-950 border-2 border-amber-500/60 rounded-2xl overflow-hidden shadow-2xl flex flex-col justify-between">
                                            <div className="h-48 overflow-hidden bg-neutral-900 relative flex items-center justify-center p-2">
                                                <img 
                                                    src={item.imageUrl} 
                                                    alt={item.name} 
                                                    className="w-full h-full object-cover rounded-lg" 
                                                    onError={(e) => { e.target.onerror = null; e.target.src = getSvgPlaceholder(item.id); }}
                                                />
                                            </div>
                                            <div className="p-4 space-y-3 bg-neutral-900 flex-grow flex flex-col justify-between">
                                                <div className="space-y-2">
                                                    <div>
                                                        <label className="block text-[9px] text-amber-300 font-bold uppercase">Gown ID / Number</label>
                                                        <input
                                                            type="text"
                                                            defaultValue={item.id}
                                                            onBlur={(e) => updateItemField(item.id, 'id', e.target.value)}
                                                            className="w-full bg-neutral-950 border border-amber-500/60 rounded-lg px-2.5 py-1.5 text-xs text-amber-300 font-mono font-bold focus:outline-none"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-[9px] text-amber-300 font-bold uppercase">Gown Name</label>
                                                        <input
                                                            type="text"
                                                            defaultValue={item.name}
                                                            onBlur={(e) => updateItemField(item.id, 'name', e.target.value)}
                                                            className="w-full bg-neutral-950 border border-amber-500/60 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none font-serif"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-[9px] text-emerald-400 font-bold uppercase">Price ($)</label>
                                                        <input
                                                            type="number"
                                                            step="0.01"
                                                            defaultValue={item.price}
                                                            onBlur={(e) => updateItemField(item.id, 'price', e.target.value)}
                                                            className="w-full bg-neutral-950 border border-emerald-500/60 rounded-lg px-2.5 py-1.5 text-xs text-emerald-300 font-mono font-bold focus:outline-none"
                                                        />
                                                    </div>
                                                </div>
                                                <div className="pt-3 border-t border-neutral-800">
                                                    <button
                                                        onClick={() => deleteItem(item.id)}
                                                        className="w-full bg-rose-950 hover:bg-rose-900 text-rose-200 border border-rose-600 text-xs py-2.5 rounded-xl font-bold transition cursor-pointer shadow-lg flex items-center justify-center gap-1.5"
                                                    >
                                                        🗑️ Delete from Website
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="border-t border-neutral-800 bg-neutral-950 py-6 text-center text-xs text-neutral-400 mt-12">
                        <p className="font-serif text-amber-200 text-sm">Simple Fab 2.0 Central Admin Studio</p>
                        <p>&copy; 2026 Developed by Jeff O.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<SecureAdminStudio />, document.getElementById('root'));
    </script>
</body>
</html>
