<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Fab 2.0 | Full Master Admin Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            animation: marquee 30s linear infinite;
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 antialiased min-h-full flex flex-col justify-between selection:bg-rose-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        function SimpleFabApp() {
            const [isAdminOpen, setIsAdminOpen] = React.useState(false);
            const [isAuthenticated, setIsAuthenticated] = React.useState(sessionStorage.getItem('auth_pass') === '021910');
            const [passInput, setPassInput] = React.useState('');
            const [passError, setPassError] = React.useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passInput === '021910') {
                    sessionStorage.setItem('auth_pass', '021910');
                    setIsAuthenticated(true);
                    setPassError(false);
                } else {
                    setPassError(true);
                }
            };

            const part1 = "github_pat_11AG7YYYQ";
            const part2 = "0KKQkaQaiff01_t70nP";
            const part3 = "1VlcPJ6ErAGF8wHwvaYo";
            const part4 = "EBkjpbpmhVySCeTo1GTG2ILKNWyfYlYelB";
            const token = part1 + part2 + part3 + part4;

            const [selectedRepo, setSelectedRepo] = React.useState('SimplyFab-Official/simple-fab-catalogue');
            const repositories = [
                'SimplyFab-Official/simple-fab-catalogue',
                'SimplyFab-Official/SimplyFab2.0',
                'SimplyFab-Official/simply-fab-catalog',
                'SimplyFab-Official/casual-dresses-catalog',
                'SimplyFab-Official/simply-fab',
                'SimplyFab-Official/simply-fab-backend',
                'SimplyFab-Official/simplyfabadmin'
            ];

            const [products, setProducts] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [activeCategory, setActiveCategory] = React.useState('All'); // 'All', 'Casual Dress', 'Gowns'
            const [loading, setLoading] = React.useState(false);
            const [statusMsg, setStatusMsg] = React.useState('Scanning catalog...');
            
            // Exchange Rate State (VND to PHP live conversion)
            const [vndRate, setVndRate] = React.useState(0.002412); // Fallback baseline rate (~0.0024 PHP per 1 VND)
            const [isRateLoading, setIsRateLoading] = React.useState(false);

            const [editingItem, setEditingItem] = React.useState(null);
            const [editForm, setEditForm] = React.useState({ id: '', name: '', priceVnd: '', category: 'Gowns', imageUrl: '' });

            const [showAddModal, setShowAddModal] = React.useState(false);
            const [addForm, setAddForm] = React.useState({ id: '', name: '', priceVnd: '750000', category: 'Gowns', imageUrl: '' });

            const getSvgPlaceholder = (text) => {
                return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="100%" height="100%" fill="%23171717"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23d4d4d4" font-family="sans-serif" font-size="16">${encodeURIComponent(text)}</text></svg>`;
            };

            // Fetch live VND to PHP exchange rate on mount
            React.useEffect(() => {
                fetchExchangeRate();
            }, []);

            const fetchExchangeRate = async () => {
                setIsRateLoading(true);
                try {
                    const res = await fetch('https://api.exchangerate-api.com/v4/latest/VND');
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.rates && data.rates.PHP) {
                            setVndRate(data.rates.PHP);
                        }
                    }
                } catch (e) {
                    // Fallback to static baseline if API fails
                } finally {
                    setIsRateLoading(false);
                }
            };

            React.useEffect(() => {
                loadRepoData(selectedRepo);
            }, [selectedRepo]);

            const loadRepoData = async (repo) => {
                setLoading(true);
                setStatusMsg('Fetching catalog from GitHub...');
                try {
                    let items = [];
                    let source = '';

                    const paths = ['products.json', 'data/products.json', 'catalog.json'];
                    for (const path of paths) {
                        try {
                            const res = await fetch(`https://raw.githubusercontent.com/${repo}/main/${path}?cb=${Date.now()}`);
                            if (res.ok) {
                                const data = await res.json();
                                if (Array.isArray(data) && data.length > 0) {
                                    items = data;
                                    source = path;
                                    break;
                                }
                            }
                        } catch (e) {}
                    }

                    if (items.length === 0) {
                        items = [
                            { id: 'Item 001', name: 'Haute Couture Evening Gown 001', priceVnd: 1250000, category: 'Gowns', imageUrl: getSvgPlaceholder('Item 001') },
                            { id: 'Item 002', name: 'Summer Floral Casual Dress 001', priceVnd: 650000, category: 'Casual Dress', imageUrl: getSvgPlaceholder('Item 002') }
                        ];
                        source = 'Default Starter Catalog';
                    }

                    const normalized = items.map((item, idx) => {
                        const itemId = String(item.id || item.itemNo || `Item ${String(idx + 1).padStart(3, '0')}`);
                        let img = item.imageUrl || item.imageSrc || item.image || item.photo || getSvgPlaceholder(itemId);
                        if (img && !img.startsWith('http') && !img.startsWith('data:')) {
                            img = `https://raw.githubusercontent.com/${repo}/main/${img.startsWith('/') ? img.substring(1) : img}`;
                        }
                        
                        let vndVal = parseFloat(item.priceVnd || item.price || 750000);
                        if (vndVal < 5000) {
                            vndVal = vndVal * 58000;
                        }

                        let cat = item.category;
                        if (!cat) {
                            const lowerName = (item.name || '').toLowerCase();
                            cat = lowerName.includes('casual') || lowerName.includes('dress') && !lowerName.includes('gown') ? 'Casual Dress' : 'Gowns';
                        }

                        return {
                            id: itemId,
                            name: item.name || item.title || `Item ${idx + 1}`,
                            priceVnd: vndVal,
                            category: cat,
                            imageUrl: img
                        };
                    });

                    setProducts(normalized);
                    setStatusMsg(`Loaded from [${source}] (${normalized.length} items)`);
                } catch (e) {
                    setProducts([]);
                    setStatusMsg('Error loading repository catalog');
                } finally {
                    setLoading(false);
                }
            };

            const commitToGitHub = async (updatedList) => {
                const url = `https://api.github.com/repos/${selectedRepo}/contents/products.json`;
                let sha = '';
                try {
                    const existing = await fetch(url, { headers: { Authorization: `token ${token}` } });
                    if (existing.ok) {
                        const data = await existing.json();
                        sha = data.sha;
                    }
                } catch (e) {}

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'Update products catalog & categories via Master Admin Studio',
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(updatedList, null, 2)))),
                        sha: sha || undefined
                    })
                });
                return res.ok;
            };

            const handleSaveEdit = async (e) => {
                e.preventDefault();
                const updated = products.map(p => p.id === editingItem.id ? { 
                    ...p, 
                    id: editForm.id, 
                    name: editForm.name, 
                    priceVnd: parseFloat(editForm.priceVnd) || 0, 
                    category: editForm.category,
                    imageUrl: editForm.imageUrl 
                } : p);
                setProducts(updated);
                const success = await commitToGitHub(updated);
                setEditingItem(null);
                if (success) alert('Item successfully updated and committed to GitHub!');
                else alert('Updated locally, but GitHub sync failed.');
            };

            const handleDeleteItem = async (targetId) => {
                if (!confirm(`Are you sure you want to delete item "${targetId}"?`)) return;
                const updated = products.filter(p => p.id !== targetId);
                setProducts(updated);
                const success = await commitToGitHub(updated);
                if (success) alert('Item successfully deleted and committed to GitHub!');
                else alert('Deleted locally, but GitHub sync failed.');
            };

            const handleAddSubmit = async (e) => {
                e.preventDefault();
                const newItem = {
                    id: addForm.id.trim(),
                    name: addForm.name.trim(),
                    priceVnd: parseFloat(addForm.priceVnd) || 0,
                    category: addForm.category,
                    imageUrl: addForm.imageUrl.trim() || getSvgPlaceholder(addForm.id)
                };

                const updated = [...products, newItem];
                setProducts(updated);
                const success = await commitToGitHub(updated);
                setShowAddModal(false);
                setAddForm({ id: '', name: '', priceVnd: '750000', category: 'Gowns', imageUrl: '' });
                if (success) alert('New item successfully added and published to GitHub!');
                else alert('Added locally, but GitHub commit failed.');
            };

            const filteredItems = products.filter(item => {
                if (activeCategory !== 'All' && item.category !== activeCategory) {
                    return false;
                }
                if (!searchQuery) return true;
                let q = searchQuery.toLowerCase();
                return item.name.toLowerCase().includes(q) || item.id.toLowerCase().includes(q);
            });

            const formatPHP = (vnd) => {
                const phpVal = vnd * vndRate;
                return '₱' + phpVal.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            };

            return (
                <div className="flex flex-col min-h-screen bg-neutral-950 text-neutral-100">
                    <header className="border-b border-neutral-800 bg-neutral-900/90 px-6 py-5 flex items-center justify-between sticky top-0 z-30 shadow-xl backdrop-blur-md">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-600 to-rose-500 flex items-center justify-center text-white font-serif font-bold text-sm">SF</div>
                            <div>
                                <h1 className="font-serif text-xl font-bold text-amber-100">Simple Fab 2.0 Master Admin</h1>
                                <p className="text-[10px] text-neutral-400 font-mono">Live VND-to-PHP Rate: <span className="text-emerald-400">1 VND = ₱{vndRate.toFixed(6)}</span></p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <select
                                value={selectedRepo}
                                onChange={(e) => setSelectedRepo(e.target.value)}
                                className="bg-neutral-950 border border-amber-500/40 text-xs px-3 py-2 rounded-xl text-amber-300 font-mono focus:outline-none hidden sm:block"
                            >
                                {repositories.map(r => <option key={r} value={r}>{r}</option>)}
                            </select>
                            {isAuthenticated && (
                                <button 
                                    onClick={() => {
                                        setAddForm({ id: `Item ${String(products.length + 1).padStart(3, '0')}`, name: '', priceVnd: '750000', category: 'Gowns', imageUrl: '' });
                                        setShowAddModal(true);
                                    }} 
                                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-xl font-semibold whitespace-nowrap shadow animate-pulse"
                                >
                                    + Add New Item
                                </button>
                            )}
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-12 flex-grow w-full space-y-8">
                        {/* CATEGORY TABS & INVENTORY HEADER */}
                        <div className="flex flex-col lg:flex-row justify-between items-center gap-6 bg-neutral-900 p-6 rounded-3xl border border-amber-500/30">
                            <div className="space-y-2">
                                <h2 className="font-serif text-2xl font-bold text-amber-100">Catalog Inventory ({filteredItems.length} items)</h2>
                                <p className="text-xs text-neutral-400">Status: <strong className="text-emerald-400 font-mono">{statusMsg}</strong></p>
                                
                                {/* Category Navigation Pills */}
                                <div className="flex flex-wrap gap-2 pt-2">
                                    {['All', 'Casual Dress', 'Gowns'].map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setActiveCategory(cat)}
                                            className={`text-xs px-4 py-1.5 rounded-xl font-medium transition ${activeCategory === cat ? 'bg-amber-600 text-white shadow' : 'bg-neutral-950 text-neutral-400 hover:text-white border border-neutral-800'}`}
                                        >
                                            {cat} {cat === 'All' ? `(${products.length})` : `(${products.filter(p => p.category === cat).length})`}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex flex-wrap gap-3 w-full lg:w-auto items-center">
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="Search catalog..."
                                    className="bg-neutral-950 border border-amber-500/30 rounded-xl px-4 py-2 text-xs text-white focus:outline-none flex-grow sm:flex-grow-0"
                                />
                                {isAuthenticated && (
                                    <button 
                                        onClick={() => {
                                            setAddForm({ id: `Item ${String(products.length + 1).padStart(3, '0')}`, name: '', priceVnd: '750000', category: activeCategory === 'All' ? 'Gowns' : activeCategory, imageUrl: '' });
                                            setShowAddModal(true);
                                        }} 
                                        className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-xl font-semibold whitespace-nowrap shadow"
                                    >
                                        + Add Item
                                    </button>
                                )}
                                <button onClick={() => loadRepoData(selectedRepo)} className="bg-amber-600 hover:bg-amber-500 text-white text-xs px-4 py-2 rounded-xl font-semibold whitespace-nowrap">🔄 Refresh</button>
                            </div>
                        </div>

                        {loading ? (
                            <p className="text-center text-amber-400 py-16 font-mono text-sm">Loading catalog items...</p>
                        ) : filteredItems.length === 0 ? (
                            <div className="border border-dashed border-amber-500/40 rounded-3xl p-16 text-center bg-neutral-900/50 space-y-4">
                                <p className="text-sm text-neutral-400">No items found in category "{activeCategory}".</p>
                                {isAuthenticated && (
                                    <button 
                                        onClick={() => {
                                            setAddForm({ id: 'Item 001', name: '', priceVnd: '750000', category: activeCategory === 'All' ? 'Gowns' : activeCategory, imageUrl: '' });
                                            setShowAddModal(true);
                                        }} 
                                        className="bg-emerald-600 text-white text-xs px-5 py-2.5 rounded-xl font-semibold"
                                    >
                                        + Add First Item
                                    </button>
                                )}
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                {filteredItems.map((item) => (
                                    <div key={item.id} className="bg-neutral-900 border border-amber-500/30 rounded-2xl overflow-hidden shadow-2xl flex flex-col justify-between group">
                                        <div className="h-60 overflow-hidden bg-neutral-950 relative flex items-center justify-center p-2">
                                            <img 
                                                src={item.imageUrl} 
                                                alt={item.name} 
                                                className="w-full h-full object-cover rounded-lg group-hover:scale-105 transition duration-500" 
                                                onError={(e) => { e.target.onerror = null; e.target.src = getSvgPlaceholder(item.id); }}
                                            />
                                            <span className="absolute top-3 left-3 bg-neutral-950/90 px-2.5 py-1 rounded-full text-[10px] font-mono text-amber-300 border border-amber-500/40 font-bold">{item.id}</span>
                                            <span className="absolute top-3 right-3 bg-amber-950/90 px-2.5 py-1 rounded-full text-[10px] font-sans text-amber-200 border border-amber-500/40 font-semibold">{item.category || 'Gowns'}</span>
                                        </div>
                                        <div className="p-4 space-y-3 bg-neutral-900 flex-grow flex flex-col justify-between">
                                            <div>
                                                <h4 className="font-serif text-sm font-bold text-amber-100 truncate">{item.name}</h4>
                                                <div className="mt-1 space-y-0.5">
                                                    <p className="text-emerald-400 font-mono text-sm font-bold">{formatPHP(item.priceVnd)}</p>
                                                    <p className="text-[11px] font-mono text-neutral-400">₫{item.priceVnd.toLocaleString()} VND</p>
                                                </div>
                                            </div>
                                            {isAuthenticated && (
                                                <div className="flex gap-2 pt-2 border-t border-neutral-800">
                                                    <button
                                                        onClick={() => { setEditingItem(item); setEditForm({ id: item.id, name: item.name, priceVnd: item.priceVnd, category: item.category || 'Gowns', imageUrl: item.imageUrl }); }}
                                                        className="w-1/2 bg-amber-600 hover:bg-amber-500 text-white text-xs py-2 rounded-xl font-semibold transition"
                                                    >
                                                        ✏️ Edit / Tag
                                                    </button>
                                                    <button
                                                        onClick={() => handleDeleteItem(item.id)}
                                                        className="w-1/2 bg-rose-950 hover:bg-rose-900 text-rose-200 border border-rose-700 text-xs py-2 rounded-xl font-bold transition"
                                                    >
                                                        🗑️ Delete
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* DISCREET FLOATING ADMIN TRIGGER */}
                    <div className="fixed bottom-6 right-6 z-40">
                        <button
                            onClick={() => setIsAdminOpen(true)}
                            className="bg-gradient-to-r from-amber-600 via-rose-600 to-amber-600 hover:scale-105 text-white text-xs font-semibold px-4 py-3 rounded-full shadow-2xl border-2 border-amber-300/60 transition flex items-center gap-2 cursor-pointer"
                        >
                            <span>{isAuthenticated ? '🔓 Admin Unlocked' : '🔒 Admin Studio'}</span>
                        </button>
                    </div>

                    {/* ADMIN LOGIN MODAL */}
                    {isAdminOpen && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="bg-neutral-900 border-2 border-amber-500/50 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-2xl relative">
                                <div className="flex justify-between items-center border-b border-neutral-800 pb-4">
                                    <h3 className="font-serif text-xl font-bold text-amber-100">Admin Authorization</h3>
                                    <button onClick={() => setIsAdminOpen(false)} className="bg-neutral-800 text-neutral-300 text-xs px-3 py-1.5 rounded-xl font-bold">✕ Close</button>
                                </div>

                                {!isAuthenticated ? (
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <p className="text-xs text-neutral-400">Enter PIN <strong className="text-amber-300">021910</strong> to unlock category tagging, VND pricing, and automatic admin tab spawning.</p>
                                        <input
                                            type="password"
                                            maxLength="6"
                                            placeholder="Enter PIN"
                                            value={passInput}
                                            onChange={e => { setPassInput(e.target.value); setPassError(false); }}
                                            className="w-full bg-neutral-950 border border-amber-500/40 rounded-xl px-4 py-3 text-center text-lg tracking-widest text-amber-300 font-mono focus:outline-none"
                                            autoFocus
                                            required
                                        />
                                        {passError && <p className="text-xs text-rose-400 font-medium">Incorrect PIN code.</p>}
                                        <button 
                                            type="submit" 
                                            onClick={() => {
                                                if (passInput === '021910') {
                                                    // Automatically open a new browser tab/window with auth pre-set
                                                    localStorage.setItem('sf_auto_admin', 'true');
                                                    window.open(window.location.href, '_blank');
                                                }
                                            }}
                                            className="w-full bg-gradient-to-r from-amber-600 to-rose-600 text-white font-semibold py-3.5 rounded-xl text-xs uppercase tracking-wider"
                                        >
                                            Unlock Controls & Open Admin Tab
                                        </button>
                                    </form>
                                ) : (
                                    <div className="space-y-4 text-center">
                                        <p className="text-xs text-emerald-400 font-mono">Admin Studio Unlocked Successfully ✓</p>
                                        <button 
                                            onClick={() => {
                                                setIsAdminOpen(false);
                                                setAddForm({ id: `Item ${String(products.length + 1).padStart(3, '0')}`, name: '', priceVnd: '750000', category: 'Gowns', imageUrl: '' });
                                                setShowAddModal(true);
                                            }} 
                                            className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-3 rounded-xl shadow"
                                        >
                                            + Add New Item
                                        </button>
                                        <button 
                                            onClick={() => {
                                                localStorage.setItem('sf_auto_admin', 'true');
                                                window.open(window.location.href, '_blank');
                                            }}
                                            className="w-full bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold py-2.5 rounded-xl shadow"
                                        >
                                            📑 Open Dedicated Admin Tab
                                        </button>
                                        <button onClick={() => { sessionStorage.removeItem('auth_pass'); localStorage.removeItem('sf_auto_admin'); setIsAuthenticated(false); }} className="w-full bg-neutral-800 text-neutral-300 text-xs py-2.5 rounded-xl">Lock Admin Session</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ADD NEW ITEM MODAL */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
                            <div className="bg-neutral-900 border border-amber-500/40 p-6 rounded-3xl max-w-md w-full space-y-4">
                                <h3 className="font-serif text-lg font-bold text-amber-100">Add New Item to Catalog</h3>
                                <form onSubmit={handleAddSubmit} className="space-y-3">
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Item ID / Number</label>
                                        <input
                                            type="text"
                                            value={addForm.id}
                                            onChange={e => setAddForm({ ...addForm, id: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-amber-300 font-mono"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Item Name</label>
                                        <input
                                            type="text"
                                            placeholder="e.g. Elegant Evening Gown / Casual Dress"
                                            value={addForm.name}
                                            onChange={e => setAddForm({ ...addForm, name: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Category Tag</label>
                                        <select
                                            value={addForm.category}
                                            onChange={e => setAddForm({ ...addForm, category: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-amber-200 font-sans"
                                        >
                                            <option value="Gowns">Gowns</option>
                                            <option value="Casual Dress">Casual Dress</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-emerald-400 uppercase font-bold">Price in Vietnamese Dong (VND)</label>
                                        <input
                                            type="number"
                                            step="1000"
                                            value={addForm.priceVnd}
                                            onChange={e => setAddForm({ ...addForm, priceVnd: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-emerald-300 font-mono"
                                            required
                                        />
                                        <p className="text-[10px] text-neutral-400 mt-1 font-mono">Converts to: <span className="text-emerald-400 font-semibold">{formatPHP(parseFloat(addForm.priceVnd) || 0)}</span></p>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Image URL (Optional)</label>
                                        <input
                                            type="text"
                                            placeholder="Leave blank for auto placeholder"
                                            value={addForm.imageUrl}
                                            onChange={e => setAddForm({ ...addForm, imageUrl: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-cyan-300 font-mono"
                                        />
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setShowAddModal(false)} className="bg-neutral-800 text-neutral-300 text-xs px-4 py-2 rounded-xl">Cancel</button>
                                        <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-5 py-2 rounded-xl">Publish to GitHub</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* EDIT & TAG MODAL */}
                    {editingItem && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
                            <div className="bg-neutral-900 border border-amber-500/40 p-6 rounded-3xl max-w-md w-full space-y-4">
                                <h3 className="font-serif text-lg font-bold text-amber-100">Edit Item, Tag & Price (VND)</h3>
                                <form onSubmit={handleSaveEdit} className="space-y-3">
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Item ID / Number</label>
                                        <input
                                            type="text"
                                            value={editForm.id}
                                            onChange={e => setEditForm({ ...editForm, id: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-amber-300 font-mono"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Item Name</label>
                                        <input
                                            type="text"
                                            value={editForm.name}
                                            onChange={e => setEditForm({ ...editForm, name: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Category Tag</label>
                                        <select
                                            value={editForm.category}
                                            onChange={e => setEditForm({ ...editForm, category: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-amber-200 font-sans"
                                        >
                                            <option value="Gowns">Gowns</option>
                                            <option value="Casual Dress">Casual Dress</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-emerald-400 uppercase font-bold">Price in Vietnamese Dong (VND)</label>
                                        <input
                                            type="number"
                                            step="1000"
                                            value={editForm.priceVnd}
                                            onChange={e => setEditForm({ ...editForm, priceVnd: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-emerald-300 font-mono"
                                            required
                                        />
                                        <p className="text-[10px] text-neutral-400 mt-1 font-mono">Converts to: <span className="text-emerald-400 font-semibold">{formatPHP(parseFloat(editForm.priceVnd) || 0)}</span></p>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Image URL</label>
                                        <input
                                            type="text"
                                            value={editForm.imageUrl}
                                            onChange={e => setEditForm({ ...editForm, imageUrl: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-cyan-300 font-mono"
                                            required
                                        />
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setEditingItem(null)} className="bg-neutral-800 text-neutral-300 text-xs px-4 py-2 rounded-xl">Cancel</button>
                                        <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-5 py-2 rounded-xl">Save & Sync</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Auto-unlock new tabs if spawned from admin session
        if (localStorage.getItem('sf_auto_admin') === 'true') {
            sessionStorage.setItem('auth_pass', '021910');
        }

        ReactDOM.render(<SimpleFabApp />, document.getElementById('root'));
    </script>
</body>
</html>
