<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Fab 2.0 | Repo Admin Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            animation: marquee 30s linear infinite;
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 antialiased min-h-full flex flex-col justify-between selection:bg-rose-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        function SimpleFabApp() {
            const [isAdminOpen, setIsAdminOpen] = React.useState(false);
            const [isAuthenticated, setIsAuthenticated] = React.useState(sessionStorage.getItem('auth_pass') === '021910');
            const [passInput, setPassInput] = React.useState('');
            const [passError, setPassError] = React.useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passInput === '021910') {
                    sessionStorage.setItem('auth_pass', '021910');
                    setIsAuthenticated(true);
                    setPassError(false);
                } else {
                    setPassError(true);
                }
            };

            const part1 = "github_pat_11AG7YYYQ";
            const part2 = "0KKQkaQaiff01_t70nP";
            const part3 = "1VlcPJ6ErAGF8wHwvaYo";
            const part4 = "EBkjpbpmhVySCeTo1GTG2ILKNWyfYlYelB";
            const token = part1 + part2 + part3 + part4;

            const [selectedRepo, setSelectedRepo] = React.useState('SimplyFab-Official/simple-fab-catalogue');
            const repositories = [
                'SimplyFab-Official/simple-fab-catalogue',
                'SimplyFab-Official/SimplyFab2.0',
                'SimplyFab-Official/simply-fab-catalog',
                'SimplyFab-Official/casual-dresses-catalog',
                'SimplyFab-Official/simply-fab',
                'SimplyFab-Official/simple-fab-backend',
                'SimplyFab-Official/simplyfabadmin'
            ];

            const [products, setProducts] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [statusMsg, setStatusMsg] = React.useState('Loading...');
            
            const [editingItem, setEditingItem] = React.useState(null);
            const [editForm, setEditForm] = React.useState({ id: '', name: '', price: '', imageUrl: '' });

            const getSvgPlaceholder = (text) => {
                return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="100%" height="100%" fill="%23171717"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23d4d4d4" font-family="sans-serif" font-size="16">${encodeURIComponent(text)}</text></svg>`;
            };

            React.useEffect(() => {
                fetchRepoItems(selectedRepo);
            }, [selectedRepo]);

            const fetchRepoItems = async (repo) => {
                setLoading(true);
                setStatusMsg('Fetching from GitHub...');
                try {
                    let items = [];
                    let source = '';

                    // Direct raw file URLs for maximum reliability
                    const rawUrls = [
                        `https://raw.githubusercontent.com/${repo}/main/products.json?t=${Date.now()}`,
                        `https://raw.githubusercontent.com/${repo}/master/products.json?t=${Date.now()}`,
                        `https://raw.githubusercontent.com/${repo}/main/data/products.json?t=${Date.now()}`,
                        `https://raw.githubusercontent.com/${repo}/master/data/products.json?t=${Date.now()}`
                    ];

                    for (const url of rawUrls) {
                        try {
                            const res = await fetch(url);
                            if (res.ok) {
                                const data = await res.json();
                                if (Array.isArray(data) && data.length > 0) {
                                    items = data;
                                    source = url;
                                    break;
                                } else if (data && typeof data === 'object') {
                                    const key = Object.keys(data).find(k => Array.isArray(data[k]) && data[k].length > 0);
                                    if (key) {
                                        items = data[key];
                                        source = `${url} (${key})`;
                                        break;
                                    }
                                }
                            }
                        } catch (e) {}
                    }

                    // Fallback to GitHub Contents API if raw fails
                    if (items.length === 0) {
                        try {
                            const apiRes = await fetch(`https://api.github.com/repos/${repo}/contents/products.json`, {
                                headers: { Authorization: `token ${token}` }
                            });
                            if (apiRes.ok) {
                                const fileData = await apiRes.json();
                                if (fileData && fileData.content) {
                                    const decoded = JSON.parse(atob(fileData.content.replace(/\n/g, '')));
                                    if (Array.isArray(decoded)) {
                                        items = decoded;
                                        source = 'GitHub API (products.json)';
                                    }
                                }
                            }
                        } catch (e) {}
                    }

                    if (items.length === 0) {
                        const cached = localStorage.getItem(`cache_products_${repo}`);
                        if (cached) {
                            items = JSON.parse(cached);
                            source = 'Local Storage Cache';
                        }
                    }

                    if (items.length === 0) {
                        items = [
                            { id: 'Item 001', name: 'Haute Couture Evening Gown 001', price: 299.99, imageUrl: getSvgPlaceholder('Item 001') }
                        ];
                        source = 'Default Template';
                    }

                    const normalized = items.map((item, idx) => {
                        const itemId = String(item.id || item.itemNo || item.code || `Item ${String(idx + 1).padStart(3, '0')}`);
                        let img = item.imageUrl || item.imageSrc || item.image || item.cover || item.photo || item.picture || item.img || (Array.isArray(item.gallery) ? item.gallery[0] : null);
                        
                        if (img && !img.startsWith('http') && !img.startsWith('data:')) {
                            img = `https://raw.githubusercontent.com/${repo}/main/${img.startsWith('/') ? img.substring(1) : img}`;
                        }

                        return {
                            id: itemId,
                            name: item.name || item.title || `Gown ${idx + 1}`,
                            price: parseFloat(item.price || item.cost || 0),
                            imageUrl: img || getSvgPlaceholder(itemId)
                        };
                    });

                    setProducts(normalized);
                    setStatusMsg(`Loaded from [${source}] (${normalized.length} items)`);
                    localStorage.setItem(`cache_products_${repo}`, JSON.stringify(normalized));
                } catch (e) {
                    setProducts([]);
                    setStatusMsg('Error loading repository data');
                } finally {
                    setLoading(false);
                }
            };

            const commitToGitHub = async (updatedList) => {
                const url = `https://api.github.com/repos/${selectedRepo}/contents/products.json`;
                let sha = '';
                try {
                    const existing = await fetch(url, { headers: { Authorization: `token ${token}` } });
                    if (existing.ok) {
                        const data = await existing.json();
                        sha = data.sha;
                    }
                } catch (e) {}

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'Update products catalog via Admin Studio',
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(updatedList, null, 2)))),
                        sha: sha || undefined
                    })
                });
                return res.ok;
            };

            const handleSaveEdit = async (e) => {
                e.preventDefault();
                const updated = products.map(p => p.id === editingItem.id ? { ...p, id: editForm.id, name: editForm.name, price: parseFloat(editForm.price) || 0, imageUrl: editForm.imageUrl } : p);
                setProducts(updated);
                localStorage.setItem(`cache_products_${selectedRepo}`, JSON.stringify(updated));
                const success = await commitToGitHub(updated);
                setEditingItem(null);
                if (success) alert(`Item updated & synced to GitHub successfully!`);
                else alert(`Saved locally, but GitHub commit failed. Check token permissions.`);
            };

            const handleDeleteItem = async (targetId) => {
                if (!confirm(`Are you sure you want to delete item "${targetId}"?`)) return;
                const updated = products.filter(p => p.id !== targetId);
                setProducts(updated);
                localStorage.setItem(`cache_products_${selectedRepo}`, JSON.stringify(updated));
                const success = await commitToGitHub(updated);
                if (success) alert(`Item deleted & synced to GitHub successfully!`);
                else alert(`Deleted locally, but GitHub sync failed.`);
            };

            const addNewItem = async () => {
                const id = prompt("Enter new Item ID / Gown Number:", `Item ${String(products.length + 1).padStart(3, '0')}`);
                if (!id) return;
                const name = prompt("Enter Gown Name:", "Haute Couture Evening Gown");
                const price = parseFloat(prompt("Enter Price ($):", "299.99")) || 0;

                const newItem = {
                    id: id.trim(),
                    name: name.trim(),
                    price: price,
                    imageUrl: getSvgPlaceholder(id)
                };

                const updated = [...products, newItem];
                setProducts(updated);
                localStorage.setItem(`cache_products_${selectedRepo}`, JSON.stringify(updated));
                const success = await commitToGitHub(updated);
                if (success) alert(`New gown added & synced to GitHub successfully!`);
                else alert(`Added locally, but GitHub sync failed.`);
            };

            const filteredItems = products.filter(item => {
                if (!searchQuery) return true;
                let q = searchQuery.toLowerCase();
                return item.name.toLowerCase().includes(q) || item.id.toLowerCase().includes(q);
            });

            return (
                <div className="flex flex-col min-h-screen bg-neutral-950 text-neutral-100">
                    <header className="border-b border-neutral-800 bg-neutral-900/90 px-6 py-5 flex items-center justify-between sticky top-0 z-30 shadow-xl backdrop-blur-md">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-600 to-rose-500 flex items-center justify-center text-white font-serif font-bold text-sm">SF</div>
                            <h1 className="font-serif text-xl font-bold text-amber-100">Simple Fab 2.0 Admin Studio</h1>
                        </div>
                        <select
                            value={selectedRepo}
                            onChange={(e) => setSelectedRepo(e.target.value)}
                            className="bg-neutral-950 border border-amber-500/40 text-xs px-3 py-2 rounded-xl text-amber-300 font-mono focus:outline-none"
                        >
                            {repositories.map(r => <option key={r} value={r}>{r}</option>)}
                        </select>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-12 flex-grow w-full space-y-12">
                        <div className="flex flex-col sm:flex-row justify-between items-center gap-4 bg-neutral-900 p-6 rounded-3xl border border-amber-500/30">
                            <div>
                                <h2 className="font-serif text-2xl font-bold text-amber-100">Repository Catalog ({filteredItems.length} items)</h2>
                                <p className="text-xs text-neutral-400 mt-1">Status: <strong className="text-emerald-400 font-mono">{statusMsg}</strong></p>
                            </div>
                            <div className="flex gap-3 w-full sm:w-auto">
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="Search items..."
                                    className="bg-neutral-950 border border-amber-500/30 rounded-xl px-4 py-2 text-xs text-white focus:outline-none"
                                />
                                {isAuthenticated && (
                                    <button onClick={addNewItem} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-xl font-semibold whitespace-nowrap">+ Add New Gown</button>
                                )}
                                <button onClick={() => fetchRepoItems(selectedRepo)} className="bg-amber-600 hover:bg-amber-500 text-white text-xs px-4 py-2 rounded-xl font-semibold whitespace-nowrap">🔄 Refresh</button>
                            </div>
                        </div>

                        {loading ? (
                            <p className="text-center text-amber-400 py-16 font-mono text-sm">Loading repository catalog...</p>
                        ) : filteredItems.length === 0 ? (
                            <div className="border border-dashed border-amber-500/40 rounded-3xl p-16 text-center bg-neutral-900/50 space-y-4">
                                <p className="text-sm text-neutral-400">No items found in this repository.</p>
                                {isAuthenticated && (
                                    <button onClick={addNewItem} className="bg-emerald-600 text-white text-xs px-5 py-2.5 rounded-xl font-semibold">+ Add First Gown</button>
                                )}
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                {filteredItems.map((item) => (
                                    <div key={item.id} className="bg-neutral-900 border border-amber-500/30 rounded-2xl overflow-hidden shadow-2xl flex flex-col justify-between group">
                                        <div className="h-60 overflow-hidden bg-neutral-950 relative flex items-center justify-center p-2">
                                            <img 
                                                src={item.imageUrl} 
                                                alt={item.name} 
                                                className="w-full h-full object-cover rounded-lg group-hover:scale-105 transition duration-500" 
                                                onError={(e) => { e.target.onerror = null; e.target.src = getSvgPlaceholder(item.id); }}
                                            />
                                            <span className="absolute top-3 left-3 bg-neutral-950/90 px-2.5 py-1 rounded-full text-[10px] font-mono text-amber-300 border border-amber-500/40 font-bold">{item.id}</span>
                                        </div>
                                        <div className="p-4 space-y-3 bg-neutral-900 flex-grow flex flex-col justify-between">
                                            <div>
                                                <h4 className="font-serif text-sm font-bold text-amber-100 truncate">{item.name}</h4>
                                                <p className="text-emerald-400 font-mono text-xs font-semibold mt-1">${item.price.toFixed(2)}</p>
                                            </div>
                                            {isAuthenticated && (
                                                <div className="flex gap-2 pt-2 border-t border-neutral-800">
                                                    <button
                                                        onClick={() => { setEditingItem(item); setEditForm({ id: item.id, name: item.name, price: item.price, imageUrl: item.imageUrl }); }}
                                                        className="w-1/2 bg-amber-600 hover:bg-amber-500 text-white text-xs py-2 rounded-xl font-semibold transition"
                                                    >
                                                        ✏️ Edit / Price
                                                    </button>
                                                    <button
                                                        onClick={() => handleDeleteItem(item.id)}
                                                        className="w-1/2 bg-rose-950 hover:bg-rose-900 text-rose-200 border border-rose-700 text-xs py-2 rounded-xl font-bold transition"
                                                    >
                                                        🗑️ Delete
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-6 right-6 z-40">
                        <button
                            onClick={() => setIsAdminOpen(true)}
                            className="bg-gradient-to-r from-amber-600 via-rose-600 to-amber-600 hover:scale-105 text-white text-xs font-semibold px-4 py-3 rounded-full shadow-2xl border-2 border-amber-300/60 transition flex items-center gap-2 cursor-pointer"
                        >
                            <span>{isAuthenticated ? '🔓 Admin Unlocked' : '🔒 Admin Studio'}</span>
                        </button>
                    </div>

                    {isAdminOpen && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="bg-neutral-900 border-2 border-amber-500/50 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-2xl relative">
                                <div className="flex justify-between items-center border-b border-neutral-800 pb-4">
                                    <h3 className="font-serif text-xl font-bold text-amber-100">Admin Authorization</h3>
                                    <button onClick={() => setIsAdminOpen(false)} className="bg-neutral-800 text-neutral-300 text-xs px-3 py-1.5 rounded-xl font-bold">✕ Close</button>
                                </div>

                                {!isAuthenticated ? (
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <p className="text-xs text-neutral-400">Enter PIN <strong className="text-amber-300">021910</strong> to unlock add, edit, price updates, and delete permissions.</p>
                                        <input
                                            type="password"
                                            maxLength="6"
                                            placeholder="Enter PIN"
                                            value={passInput}
                                            onChange={e => { setPassInput(e.target.value); setPassError(false); }}
                                            className="w-full bg-neutral-950 border border-amber-500/40 rounded-xl px-4 py-3 text-center text-lg tracking-widest text-amber-300 font-mono focus:outline-none"
                                            autoFocus
                                            required
                                        />
                                        {passError && <p className="text-xs text-rose-400 font-medium">Incorrect PIN code.</p>}
                                        <button type="submit" className="w-full bg-gradient-to-r from-amber-600 to-rose-600 text-white font-semibold py-3.5 rounded-xl text-xs uppercase tracking-wider">Unlock Controls</button>
                                    </form>
                                ) : (
                                    <div className="space-y-4 text-center">
                                        <p className="text-xs text-emerald-400 font-mono">Admin Studio Unlocked Successfully ✓</p>
                                        <button onClick={addNewItem} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-3 rounded-xl shadow">+ Add New Gown to Repository</button>
                                        <button onClick={() => { sessionStorage.removeItem('auth_pass'); setIsAuthenticated(false); }} className="w-full bg-neutral-800 text-neutral-300 text-xs py-2.5 rounded-xl">Lock Admin Session</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {editingItem && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
                            <div className="bg-neutral-900 border border-amber-500/40 p-6 rounded-3xl max-w-md w-full space-y-4">
                                <h3 className="font-serif text-lg font-bold text-amber-100">Edit Gown & Update Price</h3>
                                <form onSubmit={handleSaveEdit} className="space-y-3">
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Item ID / Gown Number</label>
                                        <input
                                            type="text"
                                            value={editForm.id}
                                            onChange={e => setEditForm({ ...editForm, id: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-amber-300 font-mono"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Gown Name</label>
                                        <input
                                            type="text"
                                            value={editForm.name}
                                            onChange={e => setEditForm({ ...editForm, name: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-emerald-400 uppercase font-bold">Price ($)</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            value={editForm.price}
                                            onChange={e => setEditForm({ ...editForm, price: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-emerald-300 font-mono"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-amber-300 uppercase font-bold">Image URL</label>
                                        <input
                                            type="text"
                                            value={editForm.imageUrl}
                                            onChange={e => setEditForm({ ...editForm, imageUrl: e.target.value })}
                                            className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-xs text-cyan-300 font-mono"
                                            required
                                        />
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setEditingItem(null)} className="bg-neutral-800 text-neutral-300 text-xs px-4 py-2 rounded-xl">Cancel</button>
                                        <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-5 py-2 rounded-xl">Save & Sync</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<SimpleFabApp />, document.getElementById('root'));
    </script>
</body>
</html>
